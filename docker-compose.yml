services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Dockerfile.api CMD includes --experimental-sqlite (drive-knowledge / node:sqlite).
    ports:
      # Explicit 0.0.0.0 so Tailscale/phone can reach API (not 127.0.0.1-only).
      - "0.0.0.0:4000:4000"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "4000"
      DATA_DIR: /app/data
      # Default: reach Ollama on the Docker host (native install).
      # Bundled Docker Ollama: use -f docker-compose.ollama.yml and OLLAMA_HOST=http://ollama:11434
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-maternion/LightOnOCR-2}
      OLLAMA_REASONING_MODEL: ${OLLAMA_REASONING_MODEL:-deepseek-r1:8b}
      OLLAMA_CODER_MODEL: ${OLLAMA_CODER_MODEL:-qwen2.5-coder:7b}
      LICENSE_TIER: pro
      DATABASE_URL: file:/app/data/profiles/bootstrap/personai.db
      PERSONAI_IN_DOCKER: "1"
      # Soul News sidecar (Home widget). Host loopback from container:
      SOUL_NEWS_URL: ${SOUL_NEWS_URL:-http://host.docker.internal:8787}
      # Drive OAuth (Settings → Link Google Drive). Optional — link soft-gates when unset.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-${NEXT_PUBLIC_API_URL:-http://localhost:4000}}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SERVICE_ACCOUNT_JSON_INLINE: ${GOOGLE_SERVICE_ACCOUNT_JSON_INLINE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Baked into the static export at build time. For Tailscale/phone use the
        # MagicDNS FQDN the phone can reach, e.g.:
        #   NEXT_PUBLIC_API_URL=http://debi9.tail8175e6.ts.net:4000
        # Short hostname (http://debi9:4000) often fails on Android; prefer FQDN.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # Optional balcony/phone → Cursor MCP inbox. Opt-in profile:
  #   docker compose --profile agent-debug up -d --build agent-debug
  agent-debug:
    profiles: ["agent-debug"]
    build:
      context: .
      dockerfile: apps/agent-debug/Dockerfile
    ports:
      - "0.0.0.0:8790:8790"
    volumes:
      - ./data/agent-debug:/app/data/agent-debug
    environment:
      PORT: "8790"
      HOST: "0.0.0.0"
      DATA_DIR: /app/data/agent-debug
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      AGENT_DEBUG_COMPOSE_MODEL: ${AGENT_DEBUG_COMPOSE_MODEL:-llama3.1:8b}
      AGENT_DEBUG_VISION_MODEL: ${AGENT_DEBUG_VISION_MODEL:-${OLLAMA_VISION_MODEL:-maternion/LightOnOCR-2}}
      AGENT_DEBUG_TOKEN: ${AGENT_DEBUG_TOKEN:-}
      AGENT_DEBUG_BATCH_TIMEOUT_MS: ${AGENT_DEBUG_BATCH_TIMEOUT_MS:-90000}
      AGENT_DEBUG_CONTEXT_HINT: ${AGENT_DEBUG_CONTEXT_HINT:-}
      AGENT_DEBUG_VPS_HOST: ${AGENT_DEBUG_VPS_HOST:-}
      AGENT_DEBUG_PROFILE_HINT: ${AGENT_DEBUG_PROFILE_HINT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
