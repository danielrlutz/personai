services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "4000"
      DATA_DIR: /app/data
      # Default: reach Ollama on the Docker host (native install).
      # Bundled Docker Ollama: use -f docker-compose.ollama.yml and OLLAMA_HOST=http://ollama:11434
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-maternion/LightOnOCR-2}
      OLLAMA_REASONING_MODEL: ${OLLAMA_REASONING_MODEL:-deepseek-r1:8b}
      LICENSE_TIER: pro
      DATABASE_URL: file:/app/data/profiles/bootstrap/personai.db
      PERSONAI_IN_DOCKER: "1"
      # Drive OAuth (Settings → Link Google Drive). Optional — link soft-gates when unset.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-${NEXT_PUBLIC_API_URL:-http://localhost:4000}}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SERVICE_ACCOUNT_JSON_INLINE: ${GOOGLE_SERVICE_ACCOUNT_JSON_INLINE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Baked into the static export at build time. For Tailscale/phone use the
        # MagicDNS FQDN the phone can reach, e.g.:
        #   NEXT_PUBLIC_API_URL=http://debi9.tail8175e6.ts.net:4000
        # Short hostname (http://debi9:4000) often fails on Android; prefer FQDN.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
