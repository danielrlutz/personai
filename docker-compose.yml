services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "4000"
      DATA_DIR: /app/data
      # Default: reach Ollama on the Docker host (native install).
      # Bundled Docker Ollama: use -f docker-compose.ollama.yml and OLLAMA_HOST=http://ollama:11434
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: maternion/LightOnOCR-2
      OLLAMA_REASONING_MODEL: deepseek-r1:8b
      LICENSE_TIER: pro
      DATABASE_URL: file:/app/data/profiles/bootstrap/personai.db
      PERSONAI_IN_DOCKER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
