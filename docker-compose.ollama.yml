# Opt-in bundled Ollama — NOT loaded by default.
# Use only when you intentionally want Docker Ollama (binds host :11434):
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#   # prod:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ollama.yml up -d
#
# Do NOT include this file when a host/native Ollama already listens on :11434.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  ollama_data:
