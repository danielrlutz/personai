server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker publishes 3000:80. Absolute redirects use $server_port (80), so a
  # phone on MagicDNS:3000 following /dashboard → /dashboard/ would hit :80
  # and get ERR_CONNECTION_REFUSED. Relative Location keeps host:3000.
  absolute_redirect off;
  port_in_redirect off;

  # HTTPS terminates in front of this container (Tailscale Serve / Caddy).
  # HTTPS=1 ./scripts/vps-tailscale.sh HOST → https://HOST → 127.0.0.1:3000
  # Keep redirects host-relative so the public https:// URL stays correct.

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Service worker — must revalidate; long cache breaks updates + installability.
  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  # Web app manifest — correct MIME, short cache so install metadata stays fresh.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.json {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Next.js build assets — missing file must be a real 404 (never SPA HTML).
  location ^~ /_next/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # Foreign SPA prefixes (e.g. SvelteKit /_app). Never fall back to index.html —
  # that masks wrong/cached apps on shared hosts (MagicDNS :3000).
  location ^~ /_app/ {
    default_type text/plain;
    return 404 "Not found (PersonAI serves Next.js /_next, not /_app)\n";
  }

  # API lives on a separate container/port. Web must not SPA-fallback HTML here.
  location ^~ /api/ {
    default_type text/plain;
    return 404 "Not found (API is not served from this container)\n";
  }

  # Static files with extensions — no HTML fallback.
  # Exclude sw.js / manifests (handled above). Do not mark them immutable.
  location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff2?|map)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(js|json|webmanifest)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
  }

  # App routes (static export): file, directory, .html, then SPA shell.
  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }
}
