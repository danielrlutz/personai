server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Next.js build assets — missing file must be a real 404 (never SPA HTML).
  location ^~ /_next/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # Foreign SPA prefixes (e.g. SvelteKit /_app). Never fall back to index.html —
  # that masks wrong/cached apps on shared hosts (MagicDNS :3000).
  location ^~ /_app/ {
    default_type text/plain;
    return 404 "Not found (PersonAI serves Next.js /_next, not /_app)\n";
  }

  # API lives on a separate container/port. Web must not SPA-fallback HTML here.
  location ^~ /api/ {
    default_type text/plain;
    return 404 "Not found (API is not served from this container)\n";
  }

  # Static files with extensions — no HTML fallback.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|json|webmanifest|map)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # App routes (static export): file, directory, .html, then SPA shell.
  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }
}
