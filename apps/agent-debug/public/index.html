<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161a18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Agent Debug · PersonAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="brand">PersonAI</p>
          <h1 class="title">Agent Debug</h1>
          <p class="sub">Balcony inbox → compose → Cursor</p>
        </div>
        <div class="status-strip" id="statusStrip" role="status" aria-live="polite">
          <span class="status-dot" id="statusDot" aria-hidden="true"></span>
          <span class="status-label" id="statusLabel">connecting…</span>
        </div>
      </header>

      <section class="toolbar" aria-label="Session controls">
        <label class="field token-field">
          <span class="field-label">Token</span>
          <input
            id="tokenInput"
            type="password"
            autocomplete="off"
            enterkeyhint="done"
            placeholder="AGENT_DEBUG_TOKEN"
          />
        </label>
        <label class="check">
          <input type="checkbox" id="urgentToggle" />
          <span>Urgent</span>
        </label>
        <button type="button" id="composeBtn" class="btn ghost">Send now</button>
      </section>

      <main id="thread" class="thread" aria-live="polite"></main>

      <footer class="composer">
        <div id="previews" class="previews"></div>
        <div class="composer-row">
          <label class="attach" title="Attach images" aria-label="Attach images">
            <input
              id="fileInput"
              type="file"
              accept="image/*"
              multiple
              capture="environment"
              hidden
            />
            <span aria-hidden="true">+</span>
          </label>
          <textarea
            id="textInput"
            rows="2"
            placeholder="Message Cursor… (“wait for pictures” holds the batch)"
            enterkeyhint="send"
          ></textarea>
          <button type="button" id="sendBtn" class="btn send">Send</button>
        </div>
        <p class="hint">
          Paste images from clipboard. Batch holds ~90s or until Send now.
        </p>
      </footer>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
