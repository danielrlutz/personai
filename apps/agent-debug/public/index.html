<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161a18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Agent Debug · PersonAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="brand">PersonAI</p>
          <h1 class="title">Agent Debug</h1>
          <p class="sub">Sent → Composed → Prompted → Implemented → Live</p>
        </div>
        <div class="topbar-actions">
          <button
            type="button"
            id="refreshBtn"
            class="icon-btn"
            aria-label="Refresh thread"
            title="Refresh thread"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21 12a9 9 0 1 1-2.64-6.36"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
              <path
                d="M21 3v6h-6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            type="button"
            id="readyToggleBtn"
            class="icon-btn ready-toggle"
            aria-label="Show ready prompts"
            aria-expanded="false"
            aria-controls="readySheet"
            title="Ready prompts"
            hidden
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 6h16M4 12h10M4 18h14"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
            <span class="ready-badge" id="readyBadge" hidden>0</span>
          </button>
          <div
            class="status-strip"
            id="statusStrip"
            role="status"
            aria-live="polite"
            title="Connection status"
          >
            <span class="status-dot" id="statusDot" aria-hidden="true"></span>
            <span class="status-label" id="statusLabel">connecting…</span>
          </div>
        </div>
      </header>

      <section class="toolbar" aria-label="Session controls">
        <div class="token-row">
          <button
            type="button"
            id="tokenLockBtn"
            class="icon-btn token-lock"
            aria-label="Token saved — tap to edit"
            aria-expanded="false"
            aria-controls="tokenField"
            title="Token saved"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.75" />
              <path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
            </svg>
          </button>
          <label class="field token-field" id="tokenField">
            <span class="field-label">Token</span>
            <input
              type="text"
              name="username"
              autocomplete="username"
              value="agent-debug"
              readonly
              tabindex="-1"
              aria-hidden="true"
              class="visually-hidden"
            />
            <input
              id="tokenInput"
              type="password"
              name="password"
              autocomplete="current-password"
              enterkeyhint="done"
              placeholder="AGENT_DEBUG_TOKEN"
              aria-label="Agent debug token"
            />
          </label>
        </div>
        <div class="toolbar-actions">
          <label class="check urgent-check">
            <input type="checkbox" id="urgentToggle" aria-label="Mark as urgent" />
            <span>Urgent</span>
          </label>
          <button type="button" id="composeBtn" class="btn ghost" aria-label="Send now — flush batch">
            Send now
          </button>
        </div>
      </section>

      <div class="thread-wrap" id="threadWrap">
        <div class="pull-indicator" id="pullIndicator" aria-hidden="true">
          <span>Pull to refresh</span>
        </div>
        <main id="thread" class="thread" aria-live="polite"></main>
      </div>

      <footer class="composer">
        <div class="composer-quick" aria-label="Quick actions">
          <label class="check urgent-check mobile-only">
            <input type="checkbox" id="urgentToggleMobile" aria-label="Mark as urgent" />
            <span>Urgent</span>
          </label>
          <button
            type="button"
            id="composeBtnMobile"
            class="btn ghost mobile-only"
            aria-label="Send now — flush batch"
          >
            Send now
          </button>
        </div>
        <div id="previews" class="previews"></div>
        <div class="composer-row">
          <textarea
            id="textInput"
            rows="2"
            placeholder="Message Cursor… (“wait for pictures” holds the batch)"
            enterkeyhint="send"
            aria-label="Message text"
          ></textarea>
          <div class="composer-actions">
            <div class="attach-group" role="group" aria-label="Attach images">
              <label class="attach" title="Photo library" aria-label="Choose from photo library">
                <input
                  id="fileInput"
                  type="file"
                  accept="image/*"
                  multiple
                  hidden
                />
                <svg class="attach-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.75" />
                  <circle cx="8.5" cy="10" r="1.75" fill="currentColor" />
                  <path d="M3 16l4.5-4 3 2.5L14 12l7 7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" />
                </svg>
              </label>
              <label class="attach attach-camera" title="Take photo" aria-label="Take photo with camera">
                <input
                  id="cameraInput"
                  type="file"
                  accept="image/*"
                  capture="environment"
                  hidden
                />
                <svg class="attach-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 8h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" />
                  <circle cx="12" cy="14" r="3.25" fill="none" stroke="currentColor" stroke-width="1.75" />
                </svg>
              </label>
            </div>
            <button type="button" id="sendBtn" class="btn send" aria-label="Send message">
              Send
            </button>
          </div>
        </div>
        <p class="hint desktop-only">
          Paste images, pick from library, or use the camera. Batch holds ~90s or until Send now.
        </p>
      </footer>
    </div>

    <div class="sheet-backdrop" id="readyBackdrop" hidden></div>
    <aside
      id="readySheet"
      class="ready-sheet"
      role="dialog"
      aria-modal="true"
      aria-label="Ready prompts"
      hidden
    >
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <h2 class="sheet-title">Prompt pipeline</h2>
        <button type="button" id="readyCloseBtn" class="icon-btn" aria-label="Close ready prompts">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          </svg>
        </button>
      </header>
      <div id="readyList" class="ready-list"></div>
      <div id="archivedSection" class="archived-section" hidden>
        <h3 class="archived-title">Recently archived</h3>
        <div id="archivedList" class="ready-list archived-list"></div>
      </div>
    </aside>

    <script src="/app.js" type="module"></script>
  </body>
</html>
