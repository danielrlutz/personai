[package]
name = "personai-os"
version = "0.1.0"
description = "PersonAI OS — Privacy-First Life Management Suite"
authors = ["PersonAI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Faster iterative `cargo tauri dev` (incremental is already on by default).
[profile.dev]
incremental = true

# Smaller/faster release desktop binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
