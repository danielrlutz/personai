services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Always publish for Tailscale Serve → 127.0.0.1:4000 and MagicDNS :4000.
    # Do not rely on override alone — missing publish breaks Serve :8443.
    ports:
      - "0.0.0.0:${PORT:-4000}:4000"
    volumes:
      # Bind DATA_DIR (not a named volume) so host ./data and container stay aligned.
      # Named personai_data volumes can shadow real profiles on the host path.
      - ${DATA_DIR:-./data}:/app/data
    environment:
      PORT: "4000"
      DATA_DIR: /app/data
      # Default: host/native Ollama via Docker gateway
      # Bundled Docker Ollama: -f docker-compose.ollama.yml and OLLAMA_HOST=http://ollama:11434
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: maternion/LightOnOCR-2
      OLLAMA_REASONING_MODEL: deepseek-r1:8b
      OLLAMA_CODER_MODEL: ${OLLAMA_CODER_MODEL:-qwen2.5-coder:7b}
      LICENSE_TIER: ${LICENSE_TIER:-pro}
      NODE_ENV: production
      DATABASE_URL: file:/app/data/profiles/bootstrap/personai.db
      PERSONAI_IN_DOCKER: "1"
      SOUL_NEWS_URL: ${SOUL_NEWS_URL:-http://host.docker.internal:8787}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Build-time bake-in. Tailscale/phone: http://<host>.<tailnet>.ts.net:4000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.localhost}
    # Tailscale Serve / phone HTTP path (Caddy still owns 80/443 for public domain TLS).
    ports:
      - "${APP_PORT:-3000}:80"
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
